name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --frozen --extra dev pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff
        run: uv run --frozen --extra dev ruff check .

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Run complexipy
        uses: rohaquinlop/complexipy-action@e2b05bcc06d899a24e2b6bb8b1354ac42800a95e # v7.0.1
        with:
          paths: .
          max_complexity_allowed: 26
          output_json: true

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/spa/package-lock.json

      # spa_dist/ is gitignored, so a fresh checkout has no bundle. Without
      # this the wheel packages an empty directory and `agentaudit ui` serves
      # the placeholder to every pip consumer.
      - name: Build dashboard bundle
        run: npm ci && npm run build
        working-directory: frontend/spa

      - name: Build source and wheel distributions
        run: uv build

      - name: Assert wheel ships the dashboard
        run: |
          uv run python -c "import glob, zipfile; w = sorted(glob.glob('dist/*.whl'))[-1]; assert [n for n in zipfile.ZipFile(w).namelist() if n.endswith('spa_dist/index.html')], f'{w} is missing spa_dist/index.html'"

  docs:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      # onBrokenLinks: throw means a broken internal doc link fails here.
      - name: Build site
        run: npm run build
        working-directory: website

  # complexity is intentionally not gating: the pinned action passes -j to a
  # complexipy that no longer accepts it, so the job dies on arg parsing
  # before reading any code. It still runs for visibility.
  required:
    name: Required
    if: ${{ always() }}
    needs: [tests, lint, package, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required jobs passed
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$TESTS_RESULT" = "success"
          test "$LINT_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$DOCS_RESULT" = "success"
