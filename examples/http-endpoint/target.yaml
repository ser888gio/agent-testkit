# Copy this file and point it at your agent.
#   agentaudit run agentaudit/packs/core --target examples/http-endpoint/target.yaml
#
# Modeled on agentaudit/config/my-agent.example.yaml. No `sandbox:` key --
# packs/core is domain-agnostic and needs no fake tools.
id: my-agent

agent:
  type: http
  endpoint: "https://your-agent.example.com/chat"
  method: POST
  headers:
    Authorization: "Bearer ${AGENT_TOKEN}"   # from env, never a literal secret
  request:
    json:
      message: "{{ input }}"                 # {{ input }} = the test prompt
  response:
    text_path: "$.reply"                     # where the reply lives in the JSON
  timeout_s: 30
