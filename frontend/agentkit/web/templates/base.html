<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}agentkit{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128737;</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="agentkit runs">
      <span class="brand-mark" aria-hidden="true">AK</span>
      <span>agentkit</span>
    </a>
    <nav aria-label="Primary">
      <a href="/harness" {% if active == "harness" %}class="active" aria-current="page"{% endif %}>
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>
        <span>Harness</span>
      </a>
      <a href="/" {% if active == "runs" %}class="active" aria-current="page"{% endif %}>
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/><path d="M8 5v14"/></svg>
        <span>Runs</span>
      </a>
      <a href="/agents" {% if active == "agents" %}class="active" aria-current="page"{% endif %}>
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        <span>Agents</span>
      </a>
      <a href="/tests" {% if active == "tests" %}class="active" aria-current="page"{% endif %}>
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Tests</span>
      </a>
      <a href="/settings" {% if active == "settings" %}class="active" aria-current="page"{% endif %}>
        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.33 1.82 2 2 0 1 1-3.34 0A1.65 1.65 0 0 0 10 20a1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.82-.33 2 2 0 1 1 0-3.34A1.65 1.65 0 0 0 4 10a1.65 1.65 0 0 0 .6-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .33-1.82 2 2 0 1 1 3.34 0A1.65 1.65 0 0 0 14 4a1.65 1.65 0 0 0 1 .6 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.32.35.6.6 1 .45.28 1 .5 1.82.33a2 2 0 1 1 0 3.34A1.65 1.65 0 0 0 20 14c-.25.4-.46.68-.6 1Z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </aside>
  <main id="content" tabindex="-1">
  {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/poll.js" defer></script>
</body>
</html>
