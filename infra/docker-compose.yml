services:
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: agentkit
    command: ["agentkit", "migrate", "--db", "/data/agentkit.db"]
    environment:
      AGENTKIT_DB: /data/agentkit.db
    volumes:
      - agentkit-data:/data
    restart: "no"

  agentkit:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: agentkit
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENTKIT_DB: /data/agentkit.db
      AGENTKIT_PACKS: /opt/venv/lib/python3.12/site-packages/agentkit/packs
      AGENTKIT_AUTH_MODE: oidc
      AGENTKIT_OIDC_ISSUER: http://localhost:8080/realms/agentkit
      AGENTKIT_OIDC_JWKS_URL: http://keycloak:8080/realms/agentkit/protocol/openid-connect/certs
      AGENTKIT_OIDC_TOKEN_URL: http://keycloak:8080/realms/agentkit/protocol/openid-connect/token
      AGENTKIT_OIDC_AUDIENCE: agentkit-api
      AGENTKIT_OIDC_CLIENT_ID: agentkit-web
      AGENTKIT_OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
    volumes:
      # Persist the sqlite run store across container restarts.
      - agentkit-data:/data
    restart: unless-stopped

  keycloak-db:
    image: postgres:16.9
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      AGENTKIT_CI_ACME_SECRET: ${AGENTKIT_CI_ACME_SECRET:?set AGENTKIT_CI_ACME_SECRET in infra/.env}
      AGENTKIT_DEMO_USER_PASSWORD: ${AGENTKIT_DEMO_USER_PASSWORD:?set AGENTKIT_DEMO_USER_PASSWORD in infra/.env}
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/agentkit-realm.json:/opt/keycloak/data/import/agentkit-realm.json:ro
    restart: unless-stopped

volumes:
  agentkit-data:
  keycloak-db-data:
