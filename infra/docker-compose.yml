services:
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: agentaudit
    command: ["agentaudit", "migrate", "--db", "/data/agentaudit.db"]
    environment:
      AGENTAUDIT_DB: /data/agentaudit.db
    volumes:
      - agentaudit-data:/data
    restart: "no"

  agentaudit:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: agentaudit
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENTAUDIT_DB: /data/agentaudit.db
      AGENTAUDIT_PACKS: /opt/venv/lib/python3.12/site-packages/agentaudit/packs
      AGENTAUDIT_AUTH_MODE: oidc
      AGENTAUDIT_OIDC_ISSUER: ${AGENTAUDIT_OIDC_ISSUER:?set in infra/.env}
      AGENTAUDIT_OIDC_JWKS_URL: ${AGENTAUDIT_OIDC_JWKS_URL:?set in infra/.env}
      AGENTAUDIT_OIDC_TOKEN_URL: ${AGENTAUDIT_OIDC_TOKEN_URL:?set in infra/.env}
      AGENTAUDIT_OIDC_AUTH_URL: ${AGENTAUDIT_OIDC_AUTH_URL:?set in infra/.env}
      AGENTAUDIT_OIDC_AUDIENCE: ${AGENTAUDIT_OIDC_AUDIENCE:?set in infra/.env}
      AGENTAUDIT_OIDC_CLIENT_ID: ${AGENTAUDIT_OIDC_CLIENT_ID:?set in infra/.env}
      AGENTAUDIT_OIDC_REDIRECT_URI: ${AGENTAUDIT_OIDC_REDIRECT_URI:?set in infra/.env}
      AGENTAUDIT_SESSION_COOKIE_SECURE: ${AGENTAUDIT_SESSION_COOKIE_SECURE:-1}
      AGENTAUDIT_DEMO_MODE: ${AGENTAUDIT_DEMO_MODE:-0}
    # Same controls the worker carries. This service is the internet-facing one
    # and mounts the same volume read-write, so the weaker container was
    # guarding the data the hardened one protects. /data stays writable -- it is
    # a volume mount, which read_only does not cover -- so SQLite still gets its
    # -wal and -shm sidecars.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    volumes:
      # Persist the sqlite run store across container restarts.
      - agentaudit-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys,socket;
          req=(chr(13)+chr(10)).join(['GET / HTTP/1.0','Host: localhost','Accept: text/html','','']);
          s=socket.create_connection(('127.0.0.1',8000),3);
          s.sendall(req.encode());
          d=s.recv(64);
          sys.exit(0 if b' 303 ' in d or b' 200 ' in d else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: agentaudit
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["agentaudit", "worker", "--db", "/data/agentaudit.db"]
    environment:
      AGENTAUDIT_DB: /data/agentaudit.db
      # Deployment-wide attacker/judge models, so a demo user gets generated
      # tests without supplying a key. An org that saves its own model in
      # settings overrides these per job; absent both, generation stays off and
      # runs are the offline scripted ladder.
      #
      # Optional: unset ENDPOINT or MODEL and the role is simply off.
      AGENTAUDIT_ATTACKER_ENDPOINT: ${AGENTAUDIT_ATTACKER_ENDPOINT:-}
      AGENTAUDIT_ATTACKER_MODEL: ${AGENTAUDIT_ATTACKER_MODEL:-}
      AGENTAUDIT_ATTACKER_API_KEY: ${AGENTAUDIT_ATTACKER_API_KEY:-}
      # Free/shared model hosts stall under load, and a timeout falls back to
      # the scripted ladder without surfacing an error -- so a demo deployment
      # on a free tier wants this well above the 30s default.
      AGENTAUDIT_ATTACKER_TIMEOUT_S: ${AGENTAUDIT_ATTACKER_TIMEOUT_S:-60}
      AGENTAUDIT_JUDGE_ENDPOINT: ${AGENTAUDIT_JUDGE_ENDPOINT:-}
      AGENTAUDIT_JUDGE_MODEL: ${AGENTAUDIT_JUDGE_MODEL:-}
      AGENTAUDIT_JUDGE_API_KEY: ${AGENTAUDIT_JUDGE_API_KEY:-}
      AGENTAUDIT_JUDGE_TIMEOUT_S: ${AGENTAUDIT_JUDGE_TIMEOUT_S:-60}
    networks:
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 2g
    volumes:
      - agentaudit-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
   egress:
    driver: bridge

volumes:
  agentaudit-data:
