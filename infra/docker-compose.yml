services:
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: agentkit
    command: ["agentkit", "migrate", "--db", "/data/agentkit.db"]
    environment:
      AGENTKIT_DB: /data/agentkit.db
    volumes:
      - agentkit-data:/data
    restart: "no"

  agentkit:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: agentkit
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      # Override to point at a different packs dir or db location if needed.
      AGENTKIT_DB: /data/agentkit.db
      AGENTKIT_PACKS: /opt/venv/lib/python3.12/site-packages/agentkit/packs
    volumes:
      # Persist the sqlite run store across container restarts.
      - agentkit-data:/data
    restart: unless-stopped

volumes:
  agentkit-data:
