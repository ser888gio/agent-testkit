<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}agentkit{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128737;</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="agentkit dashboard">
      <span class="brand-mark" aria-hidden="true">AK</span>
      <span>agentkit</span>
    </a>
    <nav aria-label="Primary">
      <a href="/" {% if active == "dashboard" %}class="active" aria-current="page"{% endif %}>Dashboard</a>
      <a href="/agents" {% if active == "agents" %}class="active" aria-current="page"{% endif %}>Agents</a>
      <a href="/tests" {% if active == "tests" %}class="active" aria-current="page"{% endif %}>Tests</a>
    </nav>
  </aside>
  <main id="content" tabindex="-1">
  {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/poll.js" defer></script>
</body>
</html>
