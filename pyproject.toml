[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Black-box testing kit for AI agents: endpoint + sandbox side-effect assertions, agentic attack packs, EU AI Act compliance reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "python-multipart",
    "uvicorn",
    "jinja2",
    "pyyaml",
    "httpx",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
agentkit = "agentkit.cli:app"

[tool.setuptools.packages.find]
where = [".", "backend", "frontend"]
include = ["agentkit*"]
namespaces = true

[tool.setuptools.package-data]
agentkit = [
    "config/*.yaml",
    "packs/**/*.yaml",
]
"agentkit.web" = [
    "static/*",
    "templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]
