[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Black-box testing kit for AI agents: endpoint + sandbox side-effect assertions, agentic attack packs, EU AI Act compliance reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.1.2",
    "pydantic>=2.13.4",
    "fastapi",
    "python-multipart",
    "uvicorn",
    "jinja2",
    "pyyaml",
    "httpx",
    "typer",
    "alembic",
    "sqlalchemy",
    "pyjwt[crypto]>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
agentkit = "agentkit.cli:app"

[tool.setuptools]
include-package-data = false
packages = [
    "agentkit",
    "agentkit.config",
    "agentkit.packs",
    "agentkit.packs.core",
    "agentkit.core",
    "agentkit.domains",
    "agentkit.domains.email",
    "agentkit.domains.treasury",
    "agentkit.reports",
    "agentkit.web",
    "agentkit.migrations",
    "agentkit.migrations.versions",
]

[tool.setuptools.package-dir]
agentkit = "backend/agentkit"
"agentkit.config" = "agentkit/config"
"agentkit.packs" = "agentkit/packs"
"agentkit.packs.core" = "agentkit/packs/core"
"agentkit.core" = "backend/agentkit/core"
"agentkit.domains" = "backend/agentkit/domains"
"agentkit.domains.email" = "backend/agentkit/domains/email"
"agentkit.domains.treasury" = "backend/agentkit/domains/treasury"
"agentkit.reports" = "backend/agentkit/reports"
"agentkit.web" = "frontend/agentkit/web"
"agentkit.migrations" = "infra/alembic"
"agentkit.migrations.versions" = "infra/alembic/versions"

[tool.setuptools.package-data]
"agentkit.config" = ["*.yaml"]
"agentkit.packs" = ["**/*.yaml"]
"agentkit.web" = [
    "static/*",
    "templates/*",
]
"agentkit.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "fastapi.Depends"]
