[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
version = "0.1.0"
description = "Black-box testing kit for AI agents: endpoint + sandbox side-effect assertions, agentic attack packs, EU AI Act compliance reports."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.1.2",
    "pydantic>=2.13.4",
    "fastapi",
    "python-multipart",
    "uvicorn",
    "jinja2",
    "pyyaml",
    "httpx",
    "typer",
    "alembic",
    "sqlalchemy",
    "pyjwt[crypto]>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
agentaudit = "agentaudit.cli:app"

[tool.setuptools]
include-package-data = false
packages = [
    "agentaudit",
    "agentaudit.config",
    "agentaudit.packs",
    "agentaudit.packs.core",
    "agentaudit.core",
    "agentaudit.domains",
    "agentaudit.domains.email",
    "agentaudit.domains.treasury",
    "agentaudit.reports",
    "agentaudit.web",
    "agentaudit.migrations",
    "agentaudit.migrations.versions",
]

[tool.setuptools.package-dir]
agentaudit = "backend/agentaudit"
"agentaudit.config" = "agentaudit/config"
"agentaudit.packs" = "agentaudit/packs"
"agentaudit.packs.core" = "agentaudit/packs/core"
"agentaudit.core" = "backend/agentaudit/core"
"agentaudit.domains" = "backend/agentaudit/domains"
"agentaudit.domains.email" = "backend/agentaudit/domains/email"
"agentaudit.domains.treasury" = "backend/agentaudit/domains/treasury"
"agentaudit.reports" = "backend/agentaudit/reports"
"agentaudit.web" = "frontend/agentaudit/web"
"agentaudit.migrations" = "infra/alembic"
"agentaudit.migrations.versions" = "infra/alembic/versions"

[tool.setuptools.package-data]
"agentaudit.config" = ["*.yaml"]
"agentaudit.packs" = ["**/*.yaml"]
"agentaudit.web" = [
    "static/*",
    "templates/*",
]
"agentaudit.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The package lives under backend/ and frontend/, not beside pyproject.toml, so ruff cannot
# infer it as first-party and would sort `agentaudit` in with third-party imports.
known-first-party = ["agentaudit"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "fastapi.Depends"]
